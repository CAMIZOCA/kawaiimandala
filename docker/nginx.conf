user www-data;
worker_processes auto;
pid /run/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /dev/stdout;

    sendfile      on;
    tcp_nopush    on;
    server_tokens off;

    keepalive_timeout 65;

    # Subidas de mandalas (max. 30 MB) y callbacks de Activepieces (~2 MB).
    client_max_body_size 64m;
    client_body_timeout  600s;

    # nginx vuelca a disco los cuerpos que no caben en memoria. Las rutas se
    # declaran explicitamente porque los workers corren como www-data y los
    # directorios que trae el paquete pertenecen al usuario nginx: sin esto
    # cualquier subida de archivo muere con "13: Permission denied".
    client_body_temp_path /var/lib/nginx/tmp/client_body;
    fastcgi_temp_path     /var/lib/nginx/tmp/fastcgi;
    proxy_temp_path       /var/lib/nginx/tmp/proxy;
    uwsgi_temp_path       /var/lib/nginx/tmp/uwsgi;
    scgi_temp_path        /var/lib/nginx/tmp/scgi;

    # Cloudflare Tunnel + Traefik terminan TLS: se marca la peticion como HTTPS
    # para que Laravel genere URLs https (sin tocar TrustProxies).
    map $http_x_forwarded_proto $fwd_https {
        default '';
        https   on;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    server {
        listen 8080 default_server;
        server_name _;

        root /var/www/html/public;
        index index.php;

        charset utf-8;

        # Assets con hash generados por Vite: cachear agresivamente.
        location /build/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        # Front controller de Laravel.
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_param HTTPS $fwd_https if_not_empty;

            # La exportacion del PDF es sincrona.
            fastcgi_read_timeout 600s;
            fastcgi_send_timeout 600s;
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
