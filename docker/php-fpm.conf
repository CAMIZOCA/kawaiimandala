[www]
user = www-data
group = www-data

listen = 127.0.0.1:9000

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

; Sin esto PHP-FPM limpia el entorno y Laravel no ve ninguna variable de Docker.
clear_env = no

; Los errores de PHP salen por el log del contenedor.
catch_workers_output = yes
decorate_workers_output = no
php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on

; Exportaciones PDF de 48+ paginas con imagenes de 2550 px.
request_terminate_timeout = 600
