; Limites segun README (callbacks de Activepieces ~1,7 MB, escalado a 2550 px,
; subidas manuales de hasta 30 MB por mandala).
memory_limit = 1024M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 600
max_input_time = 600
max_file_uploads = 50

; La configuracion llega por variables de entorno de Docker (no hay .env).
variables_order = "EGPCS"

expose_php = Off
date.timezone = UTC

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0

realpath_cache_size = 4096k
realpath_cache_ttl = 600
